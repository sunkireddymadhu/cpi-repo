general:
  buildTool: mta

steps:
  mtaBuild:
    execute: false

  executeScript:
    execute: true
    command: |
      echo "🔍 Validating CPI Artifacts..."

      if [ ! -d "iflows" ]; then
        echo "❌ iflows folder missing"
        exit 1
      fi

      for file in $(find iflows -name "*.zip"); do
        echo "Checking $file"
        unzip -t "$file" || exit 1
      done

      echo "📦 Preparing build..."

      mkdir -p build
      cp -r iflows build/

      echo "Build content:"
      ls -R build

      echo "✅ Pipeline completed"
